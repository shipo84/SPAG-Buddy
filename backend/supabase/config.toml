project_id = "spag-buddy"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
# Teachers sign in with a magic link sent to their school email.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.api]
# The function checks pupil device tokens and teacher JWTs itself.
verify_jwt = false
